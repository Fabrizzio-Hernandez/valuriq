services:
  db:
    image: postgres:16-alpine
    container_name: valuriq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valuriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valuriq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-valuriq_db}
    ports:
      - "5432:5432"
    volumes:
      - valuriq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-valuriq} -d $${POSTGRES_DB:-valuriq_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valuriq-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-valuriq}:${POSTGRES_PASSWORD:-valuriq_secret}@db:5432/${POSTGRES_DB:-valuriq_db}
      CORS_ORIGINS: '["http://localhost:4200","http://127.0.0.1:4200","http://localhost","https://valuriq.com","https://www.valuriq.com"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valuriq-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  valuriq_pgdata:
